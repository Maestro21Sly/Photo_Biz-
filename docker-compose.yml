services:
  db:
    image: postgres:16-alpine
    container_name: snapcampus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: snapcampus
      POSTGRES_PASSWORD: snapcampus
      POSTGRES_DB: snapcampus
    ports:
      - "5432:5432"
    volumes:
      - snapcampus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapcampus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  snapcampus_pgdata:
